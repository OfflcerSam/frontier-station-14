# Only Starlight's language-related backgrounds are ported.
- type: traitCategory
  id: BackgroundTraits
  name: trait-category-background
  maxTraitPoints: 1

- type: trait
  id: Iterator
  name: trait-background-iterator-name
  description: trait-background-iterator-description
  category: BackgroundTraits
  cost: 0
  replaceLanguages: true
  languagesSpoken: [ScurretSign]
  languagesUnderstood: [ScurretSign]
  traitGear: TranslatorIterator
  # Starlight excludes Iterator from every learnable language skill.
  conflicts:
  - SignLanguage
  - ClassicalSignLanguage
  - Classical
  - CygniStandard
  - Darktongue
  - Felyaic
  - Nekomimetic
  - Canilunzt
  - Scratch
  - Aielic
  - Grumbakul
  - SolCommon
  - VoxPidgin
  - Draconic
  - Marish
  - Bubblish
  - Terrum
  - Sylvan
  - Moffic
  - Thaveyan
  - Lagomorphian
  - Squeakish
  - Foreigner
  - ForeignerLight
  - Xenosocialized

- type: trait
  id: Foreigner
  name: trait-language-foreigner-name
  description: trait-language-foreigner-desc
  category: LanguageTraits
  cost: -4
  requireLanguageOtherThan: GalacticCommon
  conflicts: [ForeignerLight, Iterator, Xenosocialized]
  components:
  - type: ForeignerTrait
    baseTranslator: TranslatorForeigner

- type: trait
  id: ForeignerLight
  name: trait-language-foreigner-light-name
  description: trait-language-foreigner-light-desc
  category: LanguageTraits
  cost: -2
  requireLanguageOtherThan: GalacticCommon
  conflicts: [Foreigner, Iterator, Xenosocialized]
  components:
  - type: ForeignerTrait
    cantUnderstand: false
    baseTranslator: TranslatorForeigner

- type: trait
  id: Xenosocialized
  name: trait-language-xenosocialized-name
  description: trait-language-xenosocialized-desc
  category: LanguageTraits
  cost: -2
  removeNativeLanguage: true
  conflicts: [Foreigner, ForeignerLight, Iterator]
