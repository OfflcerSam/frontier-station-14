- type: entity
  parent: BaseMachineCircuitboard
  id: PowerlockLVFrameMachineCircuitboard
  name: portable LV powerlock machine board
  description: A machine circuit board for a portable LV powerlock.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: PowerlockLVFrame
    requirements:
      PowerCell: 1
    stackRequirements:
      Steel: 10
      Cable: 5
  - type: BindToStation
    enabled: false

