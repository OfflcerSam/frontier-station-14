- type: entity
  parent: NFStationaryGeneratorCombustionStandardEmpty
  id: NFStationaryGeneratorCombustionStandardLiquidEmpty
  categories: [NFGeneratorConstruction]
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankStandard
