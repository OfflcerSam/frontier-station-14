- type: entity
  parent: NFLiquidFuelTankStandard
  id: NFLiquidFuelTankCombustionStandard
  name: basic standard combustion fuel tank
  components:
  - type: FuelModule
    baseCapacity: 1800
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1800

- type: entity
  parent: NFLiquidFuelTankCombustionStandard
  id: NFLiquidFuelTankCombustionStandardFull
  categories: [HideSpawnMenu]
  components:
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1800
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1800

- type: entity
  parent: NFStationaryGeneratorCombustionStandardEmpty
  id: NFStationaryGeneratorCombustionStandardLiquidEmpty
  categories: [NFGeneratorConstruction]
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankCombustionStandard
        whitelist:
          components: [FuelModule]

- type: entity
  parent: NFStationaryGeneratorCombustionStandardEmpty
  id: NFStationaryGeneratorCombustionStandardLiquidFull
