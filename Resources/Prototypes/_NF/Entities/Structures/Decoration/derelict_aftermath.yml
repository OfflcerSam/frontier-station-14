# Static aftermath stays within the generated scene and leaves boarding routes open.
- type: entity
  id: NFDerelictAftermath
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: NFDerelictAftermath
  id: NFDerelictKudzu
  name: withered kudzu
  description: A tangled mat of vines left behind after the growth stopped.
  components:
  - type: Sprite
    sprite: Objects/Misc/kudzu.rsi
    state: kudzu_11
    drawdepth: Overdoors

- type: entity
  parent: NFDerelictAftermath
  id: NFDerelictTendons
  name: withered tendons
  description: A tangled mass of tendons with no visible pulse.
  components:
  - type: Sprite
    sprite: Objects/Misc/fleshkudzu.rsi
    state: kudzu_11
    drawdepth: Overdoors

- type: entity
  parent: BaseAnomaly
  id: NFDerelictAnomaly
  name: residual anomaly
  description: An anomaly still flickering in the wreckage of a research lab.
  components:
  - type: Anomaly
    initialStabilityRange: 0.35, 0.35
    initialSeverityRange: 0.2, 0.2
    initialBehavior: Balanced
    pulseStabilityVariation: 0, 0
    corePrototype: AnomalyCoreRock
    coreInertPrototype: AnomalyCoreRockInert
  - type: Sprite
    layers:
    - state: anom6
      map: ["enum.AnomalyVisualLayers.Base"]
    - state: anom6-pulse
      map: ["enum.AnomalyVisualLayers.Animated"]
      visible: false
  - type: PointLight
    radius: 2.0
    energy: 3.0
    color: "#5ca8cb"
    castShadows: false
