# Portable ports combine gaslock frames with voltage-specific powerlock cable art.
- type: entity
  parent: [BasePowerlock, BaseStructureDynamic, ConstructibleMachine]
  id: BasePowerlockFrame
  abstract: true
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Anchorable
  - type: Rotatable
  - type: WiresPanel
  - type: WiresVisuals
  - type: Docking
    receiveOnly: true
  - type: Sprite
    sprite: _NF/Structures/Piping/Atmospherics/portable_gaslock.rsi
    layers:
    - state: base
    - state: closed_unlit
      shader: unshaded
      map: ["docked-unlit"]
      visible: false
    - state: lvStraight
      sprite: _NF/Structures/Power/Powerlock/lvlock.rsi
      map: ["cable"]
      color: Green
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: lvHeadStraight
      sprite: _NF/Structures/Power/Powerlock/lvlock.rsi
      map: ["cable-head"]
      color: White
  - type: PowerMonitoringDevice
    sprite: _NF/Structures/Piping/Atmospherics/portable_gaslock.rsi
    state: base
  - type: StaticPrice
    price: 100
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.49,0.25,0.25"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
      docking:
        shape: !type:PhysShapeCircle
          radius: 0.2
          position: "0,-0.5"
        hard: false
  - type: BindToStation
    enabled: false

- type: entity
  parent: BasePowerlockFrame
  id: PowerlockLVFrame
  suffix: Basic, 50kJ
  name: portable LV powerlock
  description: Allows power through. Accepts docking, but cannot dock. Both sides must be docked and have the device enabled to accept transfer.
  components:
  - type: Docking
    dockType: PowerLV
    radarColor: limegreen
    highlightedRadarColor: white
  - type: NodeContainer
    examinable: false # PowerlockSystem shows the matching cable connector once.
    nodes:
      power:
        !type:DockableCableNode
        nodeGroupID: Apc
  - type: PowerConsumer
    voltage: Apc
  - type: PowerSupplier
    voltage: Apc
  - type: Battery
    maxCharge: 50000
  - type: PowerNetworkBattery
    maxSupply: 15000
    supplyRampTolerance: 15000
    supplyRampRate: 500
  - type: BatteryInterface
    maxChargeRate: 15000
    maxSupply: 15000
  - type: Machine
    board: PowerlockLVFrameMachineCircuitboard

