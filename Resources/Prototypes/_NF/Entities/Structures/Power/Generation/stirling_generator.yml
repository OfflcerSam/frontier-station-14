- type: entity
  parent: PortableGeneratorSwitchableBase
  id: NFStationaryGeneratorStirlingCompact
  name: compact stirling generator
  description: A compact stationary generator with a removable fuel module.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: TileFrictionModifier
    modifier: 1
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MachineFootprint
    tiles:
    - 0, 0
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/stirling_generator_placeholder.rsi
    noRot: false
    offset: 0, 0
    scale: 0.5, 0.5
    layers:
    - state: generator
      map: ["enum.GeneratorVisualLayers.Body"]
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { color: "#AAFFAA" }
          False: { color: "#FFFFFF" }
  - type: Machine
    board: NFStationaryGeneratorStirlingCompactMachineCircuitboard
  - type: Damageable
    damageModifierSet: Metallic
  - type: RequireProjectileTarget
    active: false
  - type: ExaminableDamage
    messages: NFStationaryGeneratorDamageMessages
  - type: GeneratorFire
  - type: Flammable
    fireSpread: false
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: 1
  - type: StationaryGenerator
    ratedPower: 8000
    ratedMaximumPower: 16000
    ratedBurnRate: 0.055555556
    ratedRampRate: 1200
    ratedFuelCapacity: 0
    oxygenMolesPerFuelUnit: 0.5
  - type: FuelGenerator
    targetPower: 8000
    minTargetPower: 1000
    optimalPower: 8000
    maxTargetPower: 16000
    optimalBurnRate: 0.055555556
    fuelEfficiencyConstant: 1.3
  - type: FuelModuleHost
    moduleSize: Compact
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        whitelist:
          components: [FuelModule]
  - type: ContainerContainer
    containers:
      fuel_module: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: AmbientSound
    sound:
      path: /Audio/_NF/Machines/StationaryGenerators/engine-loop.ogg
  - type: PortableGenerator
    startChance: 1
  - type: PowerSupplier
    supplyRate: 8000
    supplyRampRate: 1200
    supplyRampTolerance: 500
  - type: Electrified
    highVoltageNode: output_hv
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output_hv
    sprite: _NF/Structures/Power/Generation/stirling_generator_placeholder.rsi
    state: generator
  - type: GeneratorExhaustGas
    gasType: CarbonDioxide
    moleRatio: 0.5
    temperature: 373.15
  - type: GuideHelp
    guides:
    - NFStationaryStirlingGenerators
  - type: FuelLeak
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorStirlingCompactMachineCircuitboard
  name: compact stirling generator machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorStirlingCompact
    requirements:
      Capacitor: 1
      Manipulator: 1
    stackRequirements:
      CableHV: 5
      Steel: 2





- type: entity
  parent: NFStationaryGeneratorStirlingCompact
  id: NFStationaryGeneratorStirlingStandard
  name: standard stirling generator
  description: A two-tile stationary generator with a removable fuel module.
  components:
  - type: Machine
    board: NFStationaryGeneratorStirlingStandardMachineCircuitboard
  - type: FuelModuleHost
    moduleSize: Standard
  - type: MachineFootprint
    tiles: ["0, 0", "0, 1"]
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,1.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: Sprite
    offset: 0, 0.5
    scale: 0.5, 1
  - type: StationaryGenerator
    ratedPower: 20000
    ratedMaximumPower: 30000
    ratedBurnRate: 0.13888889
    ratedRampRate: 3000
  - type: FuelGenerator
    targetPower: 20000
    optimalPower: 20000
    maxTargetPower: 30000
    optimalBurnRate: 0.13888889
  - type: PowerSupplier
    supplyRate: 20000
    supplyRampRate: 3000

- type: entity
  parent: NFStationaryGeneratorStirlingCompactMachineCircuitboard
  id: NFStationaryGeneratorStirlingStandardMachineCircuitboard
  name: standard stirling generator machine board
  components:
  - type: MachineBoard
    prototype: NFStationaryGeneratorStirlingStandard
    requirements:
      Capacitor: 2
      Manipulator: 1
    stackRequirements:
      CableHV: 5
      Steel: 3

- type: entity
  parent: NFStationaryGeneratorStirlingCompact
  id: NFStationaryGeneratorStirlingCompactSolid
  suffix: Solid
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        startingItem: NFFuelHopperCompact
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        whitelist:
          components: [FuelModule]

