          False: { state: power_off }
      enum.GeneratorStatusVisuals.PanelOpen:
        enum.GeneratorStatusLayers.Panel:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.Damaged:
        enum.GeneratorStatusLayers.Damage:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.FuelKind:
        enum.GeneratorStatusLayers.FuelLabel:
          none: { visible: true, state: fuel_panel }
          solid: { visible: true, state: fuel_solid }
          liquid: { visible: true, state: fuel_liquid }
          gas: { visible: true, state: fuel_gas }
        enum.GeneratorStatusLayers.FuelLamp:
          none: { visible: false }
          solid: { visible: true }
          liquid: { visible: true }
          gas: { visible: true }
      enum.GeneratorStatusVisuals.FuelLevel:
        enum.GeneratorStatusLayers.FuelLamp:
          empty: { color: "#FF544A" }
          low: { color: "#FFBA40" }
          medium: { color: "#B3E77B" }
          full: { color: "#51F28B" }
  - type: UserInterface
    interfaces:
      enum.GeneratorComponentUiKey.Key:
        type: StationaryGeneratorBoundUserInterface
- type: entity
  parent: NFStationaryGeneratorStirlingCompactMachineCircuitboard
  id: NFStationaryGeneratorStirlingStandardMachineCircuitboard
  name: standard stirling generator machine board
  components:
  - type: MachineBoard
    prototype: NFStationaryGeneratorStirlingStandardEmpty
    requirements:
      Capacitor: 2
      Manipulator: 1
    stackRequirements:
      Glass: 2
      CableHV: 5
      Steel: 3

