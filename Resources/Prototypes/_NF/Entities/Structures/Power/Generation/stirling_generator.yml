- type: entity
  parent: PortableGeneratorSwitchableBase
  id: NFStationaryGeneratorStirlingCompactEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  name: compact stirling generator
  description: |-
    A compact stirling generator for powering a variety of equipment.
    Runs off of solids or liquids depending on installation.
    Rated for up to 16 kW with basic parts.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: TileFrictionModifier
    modifier: 1
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MachineFootprint
    tiles:
    - 0, 0
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/stationary_stirlingcompact_placeholder.rsi
    noRot: false
    snapCardinals: false
    scale: 1, 1
    offset: 0, 0
    layers:
    - sprite: _NF/Structures/Power/Generation/stationary_placeholder_base.rsi
      state: base
      scale: 1, 1
      color: "#D8B66C"
      map: ["enum.GeneratorVisualLayers.Body"]
    - state: text
    - state: power_off
      map: ["enum.GeneratorStatusLayers.Power"]
    - state: panel_open
      visible: false
      map: ["enum.GeneratorStatusLayers.Panel"]
    - state: damaged
      visible: false
      map: ["enum.GeneratorStatusLayers.Damage"]
    - state: fuel_liquid
      visible: false
      map: ["enum.GeneratorStatusLayers.FuelLabel"]
    - state: fuel_lamp
      visible: false
      map: ["enum.GeneratorStatusLayers.FuelLamp"]
    - state: arrows
    - state: border
  - type: Appearance
  - type: GeneratorStatusVisuals
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorStatusLayers.Power:
          True: { state: power_on }
          False: { state: power_off }
      enum.GeneratorStatusVisuals.PanelOpen:
        enum.GeneratorStatusLayers.Panel:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.Damaged:
        enum.GeneratorStatusLayers.Damage:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.FuelKind:
        enum.GeneratorStatusLayers.FuelLabel:
          none: { visible: true, state: fuel_panel }
          solid: { visible: true, state: fuel_solid }
          liquid: { visible: true, state: fuel_liquid }
          gas: { visible: true, state: fuel_gas }
        enum.GeneratorStatusLayers.FuelLamp:
          none: { visible: false }
          solid: { visible: true }
          liquid: { visible: true }
          gas: { visible: true }
      enum.GeneratorStatusVisuals.FuelLevel:
        enum.GeneratorStatusLayers.FuelLamp:
          empty: { color: "#FF544A" }
          low: { color: "#FFBA40" }
          medium: { color: "#B3E77B" }
          full: { color: "#51F28B" }
  - type: Machine
    board: NFStationaryGeneratorStirlingCompactMachineCircuitboard
  - type: Damageable
    damageModifierSet: Metallic
  - type: RequireProjectileTarget
    active: false
  - type: ExaminableDamage
    messages: NFStationaryGeneratorDamageMessages
  - type: GeneratorFire
  - type: Flammable
    fireSpread: false
    damage:
      types:
        Heat: 1
  - type: MachineFireVisuals
  - type: StationaryGenerator
    ratedPower: 8000
    ratedMaximumPower: 16000
    ratedBurnRate: 0.055555556
    ratedRampRate: 1200
    ratedFuelCapacity: 0
    oxygenMolesPerFuelUnit: 0.5
  - type: FuelGenerator
    targetPower: 8000
    minTargetPower: 1000
    optimalPower: 8000
    maxTargetPower: 16000
    optimalBurnRate: 0.055555556
    fuelEfficiencyConstant: 1.3
  - type: FuelModuleHost
    moduleSize: Compact
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        whitelist:
          components: [FuelModule]
  - type: ContainerContainer
    containers:
      fuel_module: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: AmbientSound
    sound:
      path: /Audio/_NF/Machines/StationaryGenerators/engine-loop.ogg
  - type: PortableGenerator
    startChance: 1
  - type: PowerSupplier
    supplyRate: 8000
    supplyRampRate: 1200
    supplyRampTolerance: 500
  - type: Electrified
    highVoltageNode: output_hv
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output_hv
    sprite: _NF/Structures/Power/Generation/stationary_stirlingcompact_placeholder.rsi
    state: generator
  - type: GeneratorExhaustGas
    gasType: CarbonDioxide
    moleRatio: 0.5
    temperature: 373.15
  - type: GuideHelp
    guides:
    - NFStationaryStirlingGenerators
  - type: FuelLeak
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: UserInterface
    interfaces:
      enum.GeneratorComponentUiKey.Key:
        type: StationaryGeneratorBoundUserInterface
- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorStirlingCompactMachineCircuitboard
  name: compact stirling generator machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorStirlingCompactEmpty
    requirements:
      Capacitor: 1
      Manipulator: 1
    stackRequirements:
      Glass: 2
      CableHV: 5
      Steel: 2





- type: entity
