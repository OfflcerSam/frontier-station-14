- type: entity
  parent: NFStationaryGeneratorSteamStandardEmpty
  id: NFStationaryGeneratorSteamStandard
  suffix: Filled
  components:
  - type: PortableGenerator
    startOnMapInit: true
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankStandardFull
        whitelist:
          components: [FuelModule]
  - type: SteamTurbine
    boilerTemperature: 650
    steamPressure: 1
    wasPressurized: true
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 250
        reagents:
        - ReagentId: Water
          Quantity: 250

