# Mapping supplies only. Machine boards always build the Empty prototypes.

- type: entity
  parent: NFFuelHopperCompact
  id: NFFuelHopperCompactFull
  suffix: Full
  components:
  - type: FuelModule
    fractionalFuel:
      Plasma: 4000

- type: entity
  parent: NFLiquidFuelTankCompact
  id: NFLiquidFuelTankCompactFull
  suffix: Full
  components:
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 500
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 500

- type: entity
  parent: NFFuelHopperStandard
  id: NFFuelHopperStandardFull
  suffix: Full
  components:
  - type: FuelModule
    fractionalFuel:
      Plasma: 12000

- type: entity
  parent: NFLiquidFuelTankStandard
