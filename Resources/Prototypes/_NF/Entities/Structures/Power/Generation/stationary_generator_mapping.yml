- type: entity
  parent: NFIsotopeCellCasing
  id: NFIsotopeCellUraniumFull
  suffix: Uranium, Full
  components:
  - type: IsotopeCell
    state: Active
    fuelType: NFIsotopeFuelUranium
    loadedMaterial: 3000
    remainingLifetime: 14400

- type: entity
  parent: NFStationaryGeneratorCombustionStandardEmpty
  id: NFStationaryGeneratorCombustionStandard
  suffix: Filled
  components:
  - type: PortableGenerator
    startOnMapInit: true
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1800
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1800

- type: entity
  parent: NFStationaryGeneratorStirlingCompactEmpty
  id: NFStationaryGeneratorStirlingCompact
  suffix: Filled
  components:
  - type: PortableGenerator
    startOnMapInit: true
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankCompactFull
        whitelist:
          components: [FuelModule]

