- type: entity
  parent: PortableGeneratorSwitchableBase
  id: NFStationaryGeneratorCombustionStandardEmpty
  suffix: Empty
  name: standard combustion generator
  description: A stationary liquid-fuel engine. Requires oxygen and ventilation. Its electrical connection is at the base tile.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: TileFrictionModifier
    modifier: 1
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,1.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MachineFootprint
    tiles:
    - 0, 0
    - 0, 1
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/fixed_generator_placeholder.rsi
    noRot: false
    offset: 0, 0.5
    scale: 0.5, 1
    layers:
    - state: generator
      map: ["enum.GeneratorVisualLayers.Body"]
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { color: "#AAFFAA" }
          False: { color: "#FFFFFF" }
  - type: Construction
    graph: NFMachine1x2
    node: machine
  - type: Machine
    board: NFStationaryGeneratorCombustionStandardMachineCircuitboard
  - type: Damageable
    damageModifierSet: Metallic
  - type: RequireProjectileTarget
    active: false
  - type: ExaminableDamage
    messages: NFStationaryGeneratorDamageMessages
  - type: GeneratorFire
  - type: Flammable
    fireSpread: false
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: 1
  - type: StationaryGenerator
    ratedPower: 35000
    ratedMaximumPower: 52500
    ratedBurnRate: 0.16666667
    ratedRampRate: 8750
    ratedFuelCapacity: 1800
    oxygenMolesPerFuelUnit: 0.5
  - type: FuelGenerator
    targetPower: 35000
    minTargetPower: 1000
    optimalPower: 35000
    maxTargetPower: 52500
    optimalBurnRate: 0.16666667
    fuelEfficiencyConstant: 1.3
  - type: ChemicalFuelGeneratorAdapter
    solution: tank
    reagents:
      WeldingFuel: 1
      Ethanol: 0.8
      Plasma: 1.2
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1800
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: AmbientSound
    sound:
      path: /Audio/_NF/Machines/StationaryGenerators/engine-loop.ogg
  - type: PortableGenerator
    startChance: 1
  - type: PowerSupplier
    supplyRate: 35000
    supplyRampRate: 8750
    supplyRampTolerance: 500
  - type: Electrified
    highVoltageNode: output_hv
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output_hv
    sprite: _NF/Structures/Power/Generation/fixed_generator_placeholder.rsi
    state: generator
  - type: GeneratorExhaustGas
    gasType: CarbonDioxide
    moleRatio: 0.5
    temperature: 373.15
  - type: GuideHelp
    guides:
    - NFStationaryCombustionGenerators
  - type: FuelLeak
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorCombustionStandardMachineCircuitboard
  name: standard combustion generator machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorCombustionStandardEmpty
    requirements:
      Capacitor: 2
      Manipulator: 1
      MatterBin: 1
    stackRequirements:
      CableHV: 10
      Steel: 5





