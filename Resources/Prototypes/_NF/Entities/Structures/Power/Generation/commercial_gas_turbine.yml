- type: entity
  parent: PortableGeneratorSwitchableBase
  id: NFStationaryGeneratorGasTurbineCommercialEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  name: commercial gas turbine
  description: |-
    A commercial gas turbine for ship power.
    Runs off externally piped plasma gas and oxygen from piped or room air.
    Rated for up to 165 kW with basic parts.
    Requires north exhaust; the west port takes plasma and the south port takes air.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: TileFrictionModifier
    modifier: 1
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,1.45,2.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MachineFootprint
    tiles: ["0, 0", "1, 0", "0, 1", "1, 1", "0, 2", "1, 2"]
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/commercial_gas_turbine_placeholder.rsi
    noRot: false
    snapCardinals: false
    offset: 0.5, 1
    scale: 1, 1
    layers:
    - state: generator
      map: ["enum.GeneratorVisualLayers.Body"]
    - state: panel_open
      visible: false
      map: ["enum.GeneratorStatusLayers.Panel"]
    - state: damaged
      visible: false
      map: ["enum.GeneratorStatusLayers.Damage"]
    - state: fuel_gas
      visible: false
      map: ["enum.GeneratorStatusLayers.FuelLabel"]
    - state: fuel_lamp
      visible: false
      map: ["enum.GeneratorStatusLayers.FuelLamp"]
  - type: Appearance
  - type: GeneratorStatusVisuals
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { state: generator_on }
          False: { state: generator }
      enum.GeneratorStatusVisuals.PanelOpen:
        enum.GeneratorStatusLayers.Panel:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.Damaged:
        enum.GeneratorStatusLayers.Damage:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.FuelKind:
        enum.GeneratorStatusLayers.FuelLabel:
          none: { visible: true, state: fuel_panel }
          solid: { visible: true, state: fuel_solid }
          gas: { visible: true, state: fuel_gas }
        enum.GeneratorStatusLayers.FuelLamp:
          none: { visible: false }
          solid: { visible: true }
          gas: { visible: true }
      enum.GeneratorStatusVisuals.FuelLevel:
        enum.GeneratorStatusLayers.FuelLamp:
          empty: { color: "#FF544A" }
          low: { color: "#FFBA40" }
          medium: { color: "#B3E77B" }
          full: { color: "#51F28B" }
  - type: Construction
    graph: NFMachine2x3
    node: machine
  - type: Machine
    board: NFStationaryGeneratorGasTurbineCommercialMachineCircuitboard
  - type: Damageable
    damageModifierSet: Metallic
  - type: RequireProjectileTarget
    active: false
  - type: ExaminableDamage
    messages: NFStationaryGeneratorDamageMessages
  - type: Flammable
    fireSpread: false
    damage:
      types:
        Heat: 1
  - type: MachineFireVisuals
  - type: StationaryGenerator
    ratedPower: 110000
    ratedMaximumPower: 165000
    ratedBurnRate: 1
    ratedRampRate: 44000
    ratedFuelCapacity: 0
    oxygenMolesPerFuelUnit: 0
  - type: FuelGenerator
    targetPower: 110000
    minTargetPower: 1000
    optimalPower: 110000
    maxTargetPower: 165000
    optimalBurnRate: 1
    fuelEfficiencyConstant: 1.3
  - type: AmbientSound
    sound:
      path: /Audio/_NF/Machines/StationaryGenerators/engine-loop.ogg
  - type: PortableGenerator
    startChance: 1
  - type: PowerSupplier
    supplyRate: 110000
    supplyRampRate: 44000
    supplyRampTolerance: 500
  - type: Electrified
    highVoltageNode: output_hv
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output_hv
    sprite: _NF/Structures/Power/Generation/commercial_gas_turbine_placeholder.rsi
    state: generator
  - type: GuideHelp
    guides:
    - NFStationaryGasTurbines
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Occluder
    boundingBox: "-0.5,-0.5,1.5,2.5"
  - type: PipedGasFuel
  - type: PipedGasLeak
  - type: TurbineRotor
  - type: GeneratorPiping
    fuelNodes: [fuel]
    portOffsets:
      exhaust: 0, 3
      intake: 0, -1
      fuel: -1, 1
    portDirections:
      fuel: East
  - type: NodeContainer
    nodes:
      output_hv: !type:CableDeviceNode
        nodeGroupID: HVPower
      output_mv: !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
      exhaust: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      intake: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      fuel: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorGasTurbineCommercialMachineCircuitboard
  name: commercial gas turbine machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorGasTurbineCommercialEmpty
    requirements:
      Capacitor: 3
      Manipulator: 3
      MatterBin: 2
    stackRequirements:
      CableHV: 20
      Steel: 20
      Plasteel: 15
      ReinforcedPlasmaGlass: 5

- type: entity
  parent: NFStationaryGeneratorGasTurbineCommercialEmpty
  id: NFStationaryGeneratorGasTurbineCommercial
  suffix: Gas, 110 kW
  categories: []
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic

- type: entity
  parent: NFStationaryGeneratorGasTurbineCommercialEmpty
  id: NFStationaryGeneratorGasTurbineCommercialShip
  suffix: Gas, 110 kW, Ship
  categories: []
  components:
  - type: PortableGenerator
    startOnMapInit: true
