- type: entity
  parent: [BaseMachine, SmallConstructibleMachine]
  id: NFStationaryGeneratorIsotopeCompactEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  name: compact radioisotope thermoelectric generator
  description: |-
    A compact radioisotope thermoelectric generator for auxiliary power.
    Runs off of one uranium or bananium isotope cell.
    Rated for up to 9 kW with basic parts.
    Bananium output fluctuates; uranium provides steadier power.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Rotatable
    rotateWhileAnchored: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: MachineFootprint
    tiles: ["0, 0"]
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/isotope_generator_placeholder.rsi
    noRot: false
    snapCardinals: false
    scale: 0.5, 0.5
    layers:
    - state: generator
      map: ["enum.GeneratorVisualLayers.Body"]
    - state: panel_open
      visible: false
      map: ["enum.GeneratorStatusLayers.Panel"]
    - state: damaged
      visible: false
      map: ["enum.GeneratorStatusLayers.Damage"]
    - state: bays_empty1
      visible: false
      map: ["enum.GeneratorStatusLayers.IsotopeBays"]
  - type: Appearance
  - type: GeneratorStatusVisuals
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { state: generator_on }
          False: { state: generator }
      enum.GeneratorStatusVisuals.PanelOpen:
        enum.GeneratorStatusLayers.Panel:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.Damaged:
        enum.GeneratorStatusLayers.Damage:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.IsotopeBays:
        enum.GeneratorStatusLayers.IsotopeBays:
          closed: { visible: false }
          empty1: { visible: true, state: bays_empty1 }
          full1: { visible: true, state: bays_full1 }
          empty2: { visible: true, state: bays_empty2 }
          left2: { visible: true, state: bays_left2 }
          right2: { visible: true, state: bays_right2 }
          full2: { visible: true, state: bays_full2 }
          shielded: { visible: true, state: bays_shielded }
  - type: Machine
    board: NFStationaryGeneratorIsotopeCompactMachineCircuitboard
  - type: Damageable
    damageModifierSet: Metallic
  - type: RequireProjectileTarget
    active: false
  - type: ExaminableDamage
    messages: NFStationaryGeneratorDamageMessages
  - type: WiresPanel
  - type: IsotopeGenerator
    cellSlots: [cell1]
  - type: RadiationShielding
    cellSlots: [cell1]
  - type: RadiationBlockingContainer
    resistance: 0.5
  - type: ItemSlots
    slots:
      shielding:
        name: isotope-slot-shielding
        locked: true
        insertOnInteract: false
        disableEject: true
        swap: false
        ejectOnBreak: true
        whitelist:
          components: [RadiationShieldingInsert]
      cell1:
        name: isotope-slot-cell-one
        locked: true
        insertOnInteract: false
        disableEject: true
        swap: false
        ejectOnBreak: true
        whitelist:
          components: [IsotopeCell]
  - type: ContainerContainer
    containers:
      shielding: !type:ContainerSlot
      cell1: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: PowerSupplier
    supplyRate: 0
    enabled: false
  - type: PowerSwitchable
    examineText: power-switchable-generator-examine
    switchText: power-switchable-generator-switched
    cables:
    - voltage: HV
      node: output_hv
    - voltage: MV
      node: output_mv
  - type: UseDelay
    delay: 1
  - type: NodeContainer
    examinable: true
    nodes:
      output_hv: !type:CableDeviceNode
        nodeGroupID: HVPower
      output_mv: !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output_hv
    sprite: _NF/Structures/Power/Generation/isotope_generator_placeholder.rsi
    state: generator
  - type: AmbientSound
    enabled: false
    range: 3
    volume: -8
    sound:
      path: /Audio/Ambience/Objects/buzzing.ogg
  - type: GuideHelp
    guides: [NFStationaryIsotopeGenerators]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [Destruction]

- type: entity
  parent: NFStationaryGeneratorIsotopeCompactEmpty
  id: NFStationaryGeneratorIsotopeStandardEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  name: standard radioisotope thermoelectric generator
  description: |-
    A standard radioisotope thermoelectric generator for auxiliary power.
    Runs off of two uranium or bananium isotope cells.
    Rated for up to 18 kW with basic parts.
    Bananium output fluctuates; uranium provides steadier power.
  components:
  - type: Machine
    board: NFStationaryGeneratorIsotopeStandardMachineCircuitboard
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,1.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: MachineFootprint
    tiles: ["0, 0", "0, 1"]
  - type: Construction
    graph: NFMachine1x2
    node: machine
  - type: Sprite
    offset: 0, 0.5
    scale: 0.5, 1
  - type: IsotopeGenerator
    cellSlots: [cell1, cell2]
  - type: RadiationShielding
    cellSlots: [cell1, cell2]
  - type: ItemSlots
    slots:
      shielding:
        name: isotope-slot-shielding
        locked: true
        insertOnInteract: false
        disableEject: true
        swap: false
        ejectOnBreak: true
        whitelist:
          components: [RadiationShieldingInsert]
      cell1:
        name: isotope-slot-cell-one
        locked: true
        insertOnInteract: false
        disableEject: true
        swap: false
        ejectOnBreak: true
        whitelist:
          components: [IsotopeCell]
      cell2:
        name: isotope-slot-cell-two
        locked: true
        insertOnInteract: false
        disableEject: true
        swap: false
        ejectOnBreak: true
        whitelist:
          components: [IsotopeCell]
  - type: ContainerContainer
    containers:
      shielding: !type:ContainerSlot
      cell1: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
      cell2: !type:ContainerSlot

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorIsotopeCompactMachineCircuitboard
  name: compact radioisotope thermoelectric generator machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorIsotopeCompactEmpty
    requirements:
      Capacitor: 1
    stackRequirements:
      CableHV: 5
      Steel: 5
      Glass: 5

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorIsotopeStandardMachineCircuitboard
  name: standard radioisotope thermoelectric generator machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorIsotopeStandardEmpty
    requirements:
      Capacitor: 2
    stackRequirements:
      CableHV: 10
      Steel: 10
      Glass: 10


