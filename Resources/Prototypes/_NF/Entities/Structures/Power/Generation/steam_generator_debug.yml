- type: entity
  parent: NFStationaryGeneratorSteamStandardLiquidEmpty
  id: NFStationaryGeneratorSteamStandardDebugWater
  suffix: DEBUG, Water
  components:
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 250
        reagents:
        - ReagentId: Water
          Quantity: 250

- type: entity
  parent: NFStationaryGeneratorSteamStandardLiquidEmpty
  id: NFStationaryGeneratorSteamStandardDebugWeldingFuel
  suffix: DEBUG, Welding Fuel
  components:
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 250
        reagents:
        - ReagentId: Water
          Quantity: 250
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankStandardDebug
        whitelist:
          components: [FuelModule]

