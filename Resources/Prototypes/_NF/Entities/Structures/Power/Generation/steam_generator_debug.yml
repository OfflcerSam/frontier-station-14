- type: entity
  parent: WaterTank
  id: NFDebugWaterTank
  suffix: DEBUG, Water
  components:
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 5000
        reagents:
        - ReagentId: Water
          Quantity: 5000

