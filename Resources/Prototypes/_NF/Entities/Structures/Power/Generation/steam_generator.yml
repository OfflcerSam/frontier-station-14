- type: entity
  parent: PortableGeneratorSwitchableBase
  id: NFStationaryGeneratorSteamStandardEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  name: standard steam turbine
  description: |-
    A standard high pressure steam turbine for powering a variety of equipment.
    Runs off of solids or liquids depending on installation.
    Rated for up to 60 kW with basic parts.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: TileFrictionModifier
    modifier: 1
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,1.45,1.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: MachineFootprint
    tiles: ["0, 0", "1, 0", "0, 1", "1, 1"]
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/steam_generator_placeholder.rsi
    noRot: false
    snapCardinals: false
    offset: 0.5, 0.5
    layers:
    - state: generator
      map: ["enum.GeneratorVisualLayers.Body"]
    - state: panel_open
      visible: false
      map: ["enum.GeneratorStatusLayers.Panel"]
    - state: damaged
      visible: false
      map: ["enum.GeneratorStatusLayers.Damage"]
    - state: fuel_liquid
      visible: false
      map: ["enum.GeneratorStatusLayers.FuelLabel"]
    - state: fuel_lamp
      visible: false
      map: ["enum.GeneratorStatusLayers.FuelLamp"]
    - state: water_label
      visible: true
      map: ["enum.GeneratorStatusLayers.WaterLabel"]
    - state: water_lamp
      visible: true
      map: ["enum.GeneratorStatusLayers.WaterLamp"]
    - state: pressure_label
      visible: true
      map: ["enum.GeneratorStatusLayers.PressureLabel"]
    - state: pressure_lamp
      visible: true
      map: ["enum.GeneratorStatusLayers.PressureLamp"]
    - state: temperature_label
      visible: true
      map: ["enum.GeneratorStatusLayers.TemperatureLabel"]
    - state: temperature_lamp
      visible: true
      map: ["enum.GeneratorStatusLayers.TemperatureLamp"]
  - type: Appearance
  - type: MachineFireVisuals
  - type: GeneratorStatusVisuals
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { state: generator_on }
          False: { state: generator }
      enum.GeneratorStatusVisuals.PanelOpen:
        enum.GeneratorStatusLayers.Panel:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.Damaged:
        enum.GeneratorStatusLayers.Damage:
          True: { visible: true }
          False: { visible: false }
      enum.GeneratorStatusVisuals.FuelKind:
        enum.GeneratorStatusLayers.FuelLabel:
          none: { visible: true, state: fuel_panel }
          solid: { visible: true, state: fuel_solid }
          liquid: { visible: true, state: fuel_liquid }
        enum.GeneratorStatusLayers.FuelLamp:
          none: { visible: false }
          solid: { visible: true }
          liquid: { visible: true }
      enum.GeneratorStatusVisuals.FuelLevel:
        enum.GeneratorStatusLayers.FuelLamp:
          empty: { color: "#FF544A" }
          low: { color: "#FFBA40" }
          medium: { color: "#B3E77B" }
          full: { color: "#51F28B" }
      enum.GeneratorStatusVisuals.WaterLevel:
        enum.GeneratorStatusLayers.WaterLamp:
          empty: { color: "#FF544A" }
          low: { color: "#FFBA40" }
          medium: { color: "#B3E77B" }
          full: { color: "#51F28B" }
      enum.GeneratorStatusVisuals.PressureLevel:
        enum.GeneratorStatusLayers.PressureLamp:
          cold: { color: "#4B5563" }
          low: { color: "#FFBA40" }
          normal: { color: "#51F28B" }
          high: { color: "#FF544A" }
      enum.GeneratorStatusVisuals.TemperatureLevel:
        enum.GeneratorStatusLayers.TemperatureLamp:
          cold: { color: "#4B5563" }
          low: { color: "#FFBA40" }
          normal: { color: "#51F28B" }
          high: { color: "#FF544A" }
  - type: Construction
    graph: NFMachine2x2
    node: machine
  - type: Machine
    board: NFStationaryGeneratorSteamStandardMachineCircuitboard
  - type: Damageable
    damageModifierSet: Metallic
  - type: RequireProjectileTarget
    active: false
  - type: ExaminableDamage
    messages: NFStationaryGeneratorDamageMessages
  - type: StationaryGenerator
    ratedPower: 40000
    ratedMaximumPower: 60000
    ratedBurnRate: 0.16666667
    ratedRampRate: 2000
    ratedFuelCapacity: 0
    oxygenMolesPerFuelUnit: 0.9
  - type: FuelGenerator
    targetPower: 40000
    minTargetPower: 10000
    optimalPower: 40000
    maxTargetPower: 60000
    optimalBurnRate: 0.16666667
    fuelEfficiencyConstant: 1.3
  - type: SteamTurbine
  - type: FuelModuleHost
    moduleSize: Standard
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        whitelist:
          components: [FuelModule]
  - type: ContainerContainer
    containers:
      fuel_module: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 250
  - type: AmbientSound
    sound:
      path: /Audio/Ambience/Objects/gas_vent.ogg
  - type: PortableGenerator
    startChance: 1
  - type: PowerSupplier
    supplyRate: 40000
    supplyRampRate: 2000
    supplyRampTolerance: 500
  - type: Electrified
    highVoltageNode: output_hv
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output_hv
    sprite: _NF/Structures/Power/Generation/steam_generator_placeholder.rsi
    state: generator
  - type: GeneratorExhaustGas
    gasType: CarbonDioxide
    moleRatio: 0.9
    temperature: 373.15
  - type: GuideHelp
    guides: [NFStationarySteamGenerators]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [Destruction]

- type: entity
  parent: NFStationaryGeneratorSteamStandardEmpty
  id: NFStationaryGeneratorSteamStandardSolidEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFFuelHopperStandard
        whitelist:
          components: [FuelModule]

- type: entity
  parent: NFStationaryGeneratorSteamStandardEmpty
  id: NFStationaryGeneratorSteamStandardLiquidEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankStandard
        whitelist:
          components: [FuelModule]

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorSteamStandardMachineCircuitboard
  name: standard steam turbine machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorSteamStandardEmpty
    requirements:
      Capacitor: 2
      Manipulator: 1
      MatterBin: 1
    stackRequirements:
      CableHV: 15
      Steel: 15
      Glass: 10

- type: entity
  parent: NFStationaryGeneratorSteamStandardEmpty
  id: NFStationaryGeneratorSteamCommercialEmpty
  categories: [NFGeneratorConstruction]
  suffix: ""
  name: commercial steam turbine
  description: |-
    A commercial high pressure steam turbine for powering a variety of equipment.
    Runs off of solids or liquids depending on installation.
    Rated for up to 90 kW with basic parts.
    Requires piped exhaust. Red north ports exhaust gas; blue south ports draw air.
  components:
  - type: Machine
    board: NFStationaryGeneratorSteamCommercialMachineCircuitboard
  - type: StationaryGenerator
    ratedPower: 60000
    ratedMaximumPower: 90000
    ratedBurnRate: 0.20833333
    ratedRampRate: 3000
  - type: FuelGenerator
    targetPower: 60000
    minTargetPower: 15000
    optimalPower: 60000
    maxTargetPower: 90000
    optimalBurnRate: 0.20833333
  - type: SteamTurbine
    waterCapacity: 500
    waterLossRate: 0.027777778
    ratedSteamTemperature: 700
    ratedPressureKpa: 5000
    maximumBoilerTemperature: 1100
    heatPerFuelUnit: 97.644
    casingHeatPower: 1500
    ratedBurstRadius: 2.25
    maximumBurstRadius: 3
    ratedFlashRadius: 3
    maximumFlashRadius: 4.5
    burstIntensitySlope: 10
    burstMaximumIntensity: 60
    canBreachHull: true
    releaseOffset: 0.5, 1
  - type: FuelModuleHost
    moduleSize: Commercial
  - type: Construction
    graph: NFMachine2x3
    node: machine
  - type: MachineFootprint
    tiles: ["0, 0", "1, 0", "0, 1", "1, 1", "0, 2", "1, 2"]
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,1.45,2.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/commercial_steam_generator_placeholder.rsi
    offset: 0.5, 1
  - type: PowerMonitoringDevice
    sprite: _NF/Structures/Power/Generation/commercial_steam_generator_placeholder.rsi
  - type: GeneratorPiping
    exhaustNodes: [exhaust, exhaust_right]
    intakeNodes: [intake, intake_right]
    portOffsets:
      exhaust: 0, 3
      exhaust_right: 1, 3
      intake: 0, -1
      intake_right: 1, -1
  - type: Occluder
    boundingBox: "-0.5,-0.5,1.5,2.5"
  - type: NodeContainer
    # Node dictionaries replace inherited values; retain the switchable electrical outputs.
    nodes:
      output_hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      output_mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
      exhaust:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      exhaust_right:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      intake:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      intake_right:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 500
  - type: PowerSupplier
    supplyRate: 60000
    supplyRampRate: 3000
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 180
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [Destruction]

