- type: entity
  parent: PortableGeneratorSwitchableBase
  id: NFStationaryGeneratorSteamStandardEmpty
  suffix: Empty
  name: standard steam turbine
  description: A stationary boiler and turbine with a removable fuel module and internal water reservoir.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: TileFrictionModifier
    modifier: 1
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,1.45,1.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: MachineFootprint
    tiles: ["0, 0", "1, 0", "0, 1", "1, 1"]
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/steam_generator_placeholder.rsi
    noRot: false
    offset: 0.5, 0.5
    layers:
    - state: generator
      map: ["enum.GeneratorVisualLayers.Body"]
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { color: "#AAFFAA" }
          False: { color: "#FFFFFF" }
  - type: Construction
    graph: NFMachine2x2
    node: machine
  - type: Machine
    board: NFStationaryGeneratorSteamStandardMachineCircuitboard
  - type: Damageable
    damageModifierSet: Metallic
  - type: RequireProjectileTarget
    active: false
  - type: ExaminableDamage
    messages: NFStationaryGeneratorDamageMessages
  - type: StationaryGenerator
    ratedPower: 40000
    ratedMaximumPower: 60000
    ratedBurnRate: 0.16666667
    ratedRampRate: 2000
    ratedFuelCapacity: 0
    oxygenMolesPerFuelUnit: 0.9
  - type: FuelGenerator
    targetPower: 40000
    minTargetPower: 10000
    optimalPower: 40000
    maxTargetPower: 60000
    optimalBurnRate: 0.16666667
    fuelEfficiencyConstant: 1.3
  - type: SteamTurbine
  - type: FuelModuleHost
    moduleSize: Standard
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        whitelist:
          components: [FuelModule]
  - type: ContainerContainer
    containers:
      fuel_module: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 250
  - type: AmbientSound
    sound:
      path: /Audio/Ambience/Objects/gas_vent.ogg
  - type: PortableGenerator
    startChance: 1
  - type: PowerSupplier
    supplyRate: 40000
    supplyRampRate: 2000
    supplyRampTolerance: 500
  - type: Electrified
    highVoltageNode: output_hv
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output_hv
    sprite: _NF/Structures/Power/Generation/steam_generator_placeholder.rsi
    state: generator
  - type: GeneratorExhaustGas
    gasType: CarbonDioxide
    moleRatio: 0.9
    temperature: 373.15
  - type: GuideHelp
    guides: [NFStationarySteamGenerators]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [Destruction]

- type: entity
  parent: NFStationaryGeneratorSteamStandardEmpty
  id: NFStationaryGeneratorSteamStandardSolidEmpty
  suffix: Solid, Empty
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFFuelHopperStandard
        whitelist:
          components: [FuelModule]

- type: entity
  parent: NFStationaryGeneratorSteamStandardEmpty
  id: NFStationaryGeneratorSteamStandardLiquidEmpty
  suffix: Liquid, Empty
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankStandard
        whitelist:
          components: [FuelModule]

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorSteamStandardMachineCircuitboard
  name: standard steam turbine machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorSteamStandardEmpty
    requirements:
      Capacitor: 2
      Manipulator: 1
      MatterBin: 1
    stackRequirements:
      CableHV: 15
      Steel: 15
      Glass: 10

- type: entity
  parent: NFStationaryGeneratorSteamStandardEmpty
  id: NFStationaryGeneratorSteamCommercialEmpty
  suffix: Empty
  name: commercial steam turbine
  description: A high-pressure boiler and turbine with required piped exhaust and optional piped air. Red north ports exhaust gas; blue south ports draw air. Either or both ports on each edge can be piped.
  components:
  - type: Machine
    board: NFStationaryGeneratorSteamCommercialMachineCircuitboard
  - type: StationaryGenerator
    ratedPower: 60000
    ratedMaximumPower: 90000
    ratedBurnRate: 0.20833333
    ratedRampRate: 3000
  - type: FuelGenerator
    targetPower: 60000
    minTargetPower: 15000
    optimalPower: 60000
    maxTargetPower: 90000
    optimalBurnRate: 0.20833333
  - type: SteamTurbine
    waterCapacity: 500
    waterLossRate: 0.027777778
    ratedSteamTemperature: 700
    ratedPressureKpa: 5000
    maximumBoilerTemperature: 1100
    heatPerFuelUnit: 97.644
    casingHeatPower: 1500
    ratedBurstIntensity: 2261.9468
    maximumBurstIntensity: 9801.769
    burstIntensitySlope: 10
    burstMaximumIntensity: 60
    canBreachHull: true
    releaseOffset: 0.5, 1
  - type: FuelModuleHost
    moduleSize: Commercial
  - type: Construction
    graph: NFMachine2x3
    node: machine
  - type: MachineFootprint
    tiles: ["0, 0", "1, 0", "0, 1", "1, 1", "0, 2", "1, 2"]
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,1.45,2.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: Sprite
    sprite: _NF/Structures/Power/Generation/commercial_steam_generator_placeholder.rsi
    offset: 0.5, 1
  - type: PowerMonitoringDevice
    sprite: _NF/Structures/Power/Generation/commercial_steam_generator_placeholder.rsi
  - type: GeneratorPiping
    exhaustNodes: [exhaust, exhaust_right]
    intakeNodes: [intake, intake_right]
    portOffsets:
      exhaust: 0, 3
      exhaust_right: 1, 3
      intake: 0, -1
      intake_right: 1, -1
  - type: Occluder
    boundingBox: "-0.5,-0.5,1.5,2.5"
  - type: NodeContainer
    # Node dictionaries replace inherited values; retain the switchable electrical outputs.
    nodes:
      output_hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      output_mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
      exhaust:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      exhaust_right:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      intake:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
      intake_right:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: None
        volume: 100
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 500
  - type: PowerSupplier
    supplyRate: 60000
    supplyRampRate: 3000
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 180
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [Destruction]

- type: entity
  parent: NFStationaryGeneratorSteamCommercialEmpty
  id: NFStationaryGeneratorSteamCommercialSolidEmpty
  suffix: Solid, Empty
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
