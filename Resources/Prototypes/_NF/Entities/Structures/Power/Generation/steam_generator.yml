        disableEject: true
        ejectOnBreak: true
        startingItem: NFFuelHopperCommercial
        whitelist:
          components: [FuelModule]

- type: entity
  parent: NFStationaryGeneratorSteamCommercialEmpty
  id: NFStationaryGeneratorSteamCommercialLiquidEmpty
  suffix: Liquid, Empty
  components:
  - type: ItemSlots
    slots:
      fuel_module:
        locked: true
        insertOnInteract: false
        disableEject: true
        ejectOnBreak: true
        startingItem: NFLiquidFuelTankCommercial
        whitelist:
          components: [FuelModule]

- type: entity
  parent: BaseMachineCircuitboard
  id: NFStationaryGeneratorSteamCommercialMachineCircuitboard
  name: commercial steam turbine machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NFStationaryGeneratorSteamCommercialEmpty
    requirements:
      Capacitor: 2
      Manipulator: 2
      MatterBin: 2
    stackRequirements:
      CableHV: 20
      Steel: 25
      Glass: 15
