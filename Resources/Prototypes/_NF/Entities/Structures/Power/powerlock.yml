# Dedicated power-only docks. Art is reused from FS14's attributed gaslock RSI.
- type: entity
  parent: BaseStructure
  id: BasePowerlock
  abstract: true
  components:
  - type: Transform
    noRot: false
  - type: WiresPanel
  - type: WiresVisuals
  - type: DeviceNetwork
    deviceNetId: Wired
    examinableAddress: true
    prefix: device-address-prefix-powerlock
  - type: Powerlock
  - type: Battery
    maxCharge: 2500000
    startingCharge: 0
  - type: ExaminableBattery
  - type: PowerNetworkBattery
    maxSupply: 150000
    maxChargeRate: 5000
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: PowerConsumer
    node: power
  - type: PowerSupplier
    node: power
    enabled: false
  - type: BatteryInterface
    minChargeRate: 5000
    maxChargeRate: 150000
    minSupply: 5000
    maxSupply: 150000
  - type: UserInterface
    interfaces:
      enum.BatteryUiKey.Key:
        type: BatteryBoundUserInterface
  - type: ActivatableUI
    key: enum.BatteryUiKey.Key
  - type: DockingSignalControl
  - type: DeviceLinkSource
    ports:
    - DockStatus
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
      docking:
        shape: !type:PhysShapeCircle
          radius: 0.2
          position: "0,-0.5"
        hard: false
  - type: Appearance
  - type: InteractionOutline
  - type: Sprite
    sprite: _NF/Structures/Power/Powerlock/lvlock.rsi
    drawdepth: Doors
    layers:
    - state: closed
    - state: closed_unlit
      shader: unshaded
      map: ["docked-unlit"]
      visible: false
    - state: lvStraight
      map: ["cable"]
      color: Green
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: lvHeadStraight
      map: ["cable-head"]
      color: White
  - type: GenericVisualizer
    visuals:
      enum.PowerlockVisuals.Docked:
        docked-unlit:
          True: { visible: true }
          False: { visible: false }
  - type: PowerMonitoringDevice
    group: Powerlock
    sourceNode: power
    loadNode: power
    state: closed
  - type: StaticPrice
    price: 350
  - type: Tag
    tags:
    - ForceNoFixRotations
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BasePowerlock
  id: BaseWallPowerlock
  abstract: true
  components:
  - type: Airtight
  - type: RadiationBlocker
    resistance: 3
  - type: Occluder
  - type: BlockWeather
  - type: IconSmooth
    key: walls
    mode: NoSprite

- type: entity
  parent: BaseWallPowerlock
  id: PowerlockLV
  suffix: Basic, 50kJ
  name: LV powerlock
  description: Connects power cables on separate ships or stations together to allow power transfer. Both sides must be docked and have the device enabled to accept transfer.
  components:
  - type: Docking
    dockType: PowerLV
    radarColor: limegreen
    highlightedRadarColor: white
  - type: NodeContainer
    examinable: false # PowerlockSystem shows the matching cable connector once.
    nodes:
      power:
        !type:DockableCableNode
        nodeGroupID: Apc
  - type: PowerConsumer
    voltage: Apc
  - type: PowerSupplier
    voltage: Apc
  - type: Battery
    maxCharge: 50000
  - type: PowerNetworkBattery
    maxSupply: 15000
    supplyRampTolerance: 15000
    supplyRampRate: 500
  - type: BatteryInterface
    maxChargeRate: 15000
    maxSupply: 15000
  - type: Sprite
    sprite: _NF/Structures/Power/Powerlock/lvlock.rsi
  - type: PowerMonitoringDevice
    sprite: _NF/Structures/Power/Powerlock/lvlock.rsi
  - type: Construction
    graph: PowerlockLV
    node: powerlock

- type: entity
  parent: BaseWallPowerlock
  id: PowerlockMV
  suffix: Basic, 2.5MJ
  name: MV powerlock
  description: Connects power cables on separate ships or stations together to allow power transfer. Both sides must be docked and have the device enabled to accept transfer.
  components:
  - type: Docking
    dockType: PowerMV
    radarColor: yellow
    highlightedRadarColor: white
  - type: NodeContainer
    examinable: false # PowerlockSystem shows the matching cable connector once.
    nodes:
      power:
        !type:DockableCableNode
        nodeGroupID: MVPower
  - type: PowerConsumer
    voltage: Medium
  - type: PowerSupplier
    voltage: Medium
  - type: Sprite
    sprite: _NF/Structures/Power/Powerlock/mvlock.rsi
    layers:
    - state: closed
    - state: closed_unlit
      shader: unshaded
      map: ["docked-unlit"]
      visible: false
    - state: mvStraight
      map: ["cable"]
      color: Yellow
    - state: mvstripeStraight
      map: ["cable-stripes"]
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: mvHeadStraight
      map: ["cable-head"]
      color: White
  - type: PowerMonitoringDevice
    sprite: _NF/Structures/Power/Powerlock/mvlock.rsi
  - type: Construction
    graph: PowerlockMV
    node: powerlock

