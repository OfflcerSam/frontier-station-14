- type: entity
  parent: UnfinishedMachineFrame
  id: NFUnfinishedMachineFrame1x2
  name: 1x2 machine frame
  components:
  - type: Transform
    noRot: false
  - type: Construction
    graph: NFMachine1x2
    node: missingWires
  - type: MachineFootprint
    tiles: ["0, 0", "0, 1"]
  - type: Sprite
    noRot: false
    scale: 1, 2
    offset: 0, 0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,1.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
