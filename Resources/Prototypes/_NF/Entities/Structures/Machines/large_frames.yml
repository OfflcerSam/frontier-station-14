- type: entity
  parent: UnfinishedMachineFrame
  id: NFUnfinishedMachineFrame1x2
  name: 1x2 machine frame
  components:
  - type: Transform
    noRot: false
  - type: Construction
    graph: NFMachine1x2
    node: missingWires
  - type: MachineFootprint
    tiles: ["0, 0", "0, 1"]
  - type: Sprite
    sprite: _NF/Structures/Machines/frame_1x2_placeholder.rsi
    state: box_0
    noRot: false
    snapCardinals: false
    scale: 1, 1
    offset: 0, 0.5
    layers:
    - state: box_0
      map: ["enum.MachineFrameStatusLayers.Body"]
  - type: Appearance
  - type: MachineFrameStatusVisuals
    initialState: unwired
  - type: GenericVisualizer
    visuals:
      enum.MachineFrameStatusVisuals.Stage:
        enum.MachineFrameStatusLayers.Body:
          unwired: { state: box_0 }
          wired: { state: box_1 }
          board: { state: box_2 }
          ready: { state: box_3 }
          destroyed: { state: destroyed }
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,1.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
